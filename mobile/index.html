<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI-Enumerator Assistant - Mobile Web Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0b0f19;
        overflow: hidden;
      }
      .preview-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 100%);
      }
      .preview-header {
        margin-bottom: 16px;
        text-align: center;
        color: #94a3b8;
        font-size: 13px;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
        font-weight: 600;
        font-size: 11px;
        border: 1px solid rgba(34, 197, 94, 0.3);
      }
      .device-frame {
        width: 100%;
        max-width: 412px;
        height: 100%;
        max-height: 844px;
        background-color: #ffffff;
        border-radius: 36px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      @media (max-width: 500px), (max-height: 860px) {
        .device-frame {
          max-width: 100vw;
          max-height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
        .preview-header {
          display: none;
        }
        .preview-wrapper {
          background: #000000;
        }
      }
      #root {
        display: flex;
        flex: 1;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="preview-wrapper">
      <div class="preview-header">
        <span class="status-pill">● LIVE PREVIEW</span>
        <span>AI-Enumerator Assistant (Mobile App)</span>
      </div>
      <div class="device-frame">
        <div id="root"></div>
      </div>
    </div>
    <script type="module" src="/src/index.web.tsx"></script>
  </body>
</html>
