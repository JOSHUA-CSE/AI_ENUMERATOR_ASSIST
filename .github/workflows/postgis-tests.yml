name: Backend PostGIS Test Suite

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/postgis-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/postgis-tests.yml'
  workflow_dispatch:

jobs:
  test-postgis:
    name: Backend Pytest with PostGIS Container
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ai_enumerator_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_enumerator_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/ai_enumerator_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/ai_enumerator_ci
      ENVIRONMENT: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.0.0'
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Cached Virtualenv
        uses: actions/cache@v4
        id: cached-poetry-dependencies
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with dev

      - name: Verify PostGIS Readiness and Extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ai_enumerator_ci -c "SELECT postgis_full_version();"

      - name: Run Alembic Database Migrations
        run: poetry run alembic upgrade head

      - name: Execute Full Backend Pytest Suite Against PostGIS
        run: poetry run pytest -v --tb=short

